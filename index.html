<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Days of Code - HTML Challenge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 50px; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        .progress-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            height: 10px;
            width: 300px;
            margin: 20px auto;
            overflow: hidden;
        }
        .progress-fill {
            background: #4ade80;
            height: 100%;
            width: 1%;
            transition: width 0.5s ease;
        }
        .stats { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .stat { background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 10px; backdrop-filter: blur(10px); }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-top: 40px; }
        .project-card { background: white; border-radius: 15px; padding: 25px; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
        .project-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .project-card a {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        .project-card a:hover { transform: scale(1.05); }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 100 Days of Code</h1>
            <p>HTML/CSS/JS Challenge</p>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="stats">
                <div class="stat">📊 1/100 Days</div>
                <div class="stat">🎨 1 Projects</div>
                <div class="stat">⚡ Daily Updates</div>
            </div>
        </div>
        <div class="projects-grid">
                <div class="project-card">
                    <h3>DAY 001</h3>
                    <a href="projects/day-001.html" target="_blank">🔗 View Project</a>
                </div>
            </div>
    </div>
</body>
</html>
