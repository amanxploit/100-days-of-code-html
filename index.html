<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Days of Code - HTML Challenge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 2.5rem; color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; }
        .progress-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 10px;
            width: 300px;
            margin: 20px auto;
            overflow: hidden;
        }
        .progress-fill {
            background: #4f46e5;
            height: 100%;
            width: 2%;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        .stat {
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }
        .project-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .project-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .project-card a {
            display: inline-block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 15px;
        }
        .project-card a:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 100 Days of Code</h1>
            <p class="subtitle">HTML/CSS/JS Challenge</p>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="stats">
                <div class="stat">📊 2/100 Days</div>
                <div class="stat">🎨 2 Projects</div>
            </div>
        </div>
        <div class="projects-grid">
                <div class="project-card">
                    <h3>Day 1</h3>
                    <a href="projects/day-001.html" target="_blank">🔗 View Project</a>
                </div>
            
                <div class="project-card">
                    <h3>Day 2</h3>
                    <a href="projects/day-002.html" target="_blank">🔗 View Project</a>
                </div>
            </div>
    </div>
</body>
</html>
