<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2: Digital Clock</title>
    <style>
        /* 1. Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Light gray background as requested */
            background-color: #f4f4f7;
            /* System font stack for professional look */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1a1a1a;
        }

        /* 2. Clock Card Container */
        .clock-card {
            background-color: #ffffff;
            padding: 3rem 4rem;
            border-radius: 16px;
            text-align: center;
            /* Subtle initial shadow */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            /* Smooth transition for hover effect */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 90%;
            max-width: 450px;
        }

        /* 3. Simple Hover Effect */
        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }

        /* 4. Time Display Typography */
        .time-display {
            /* Responsive font size using clamp: min, preferred, max */
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        /* 5. Date Display Typography */
        .date-display {
            font-size: clamp(1rem, 4vw, 1.2rem);
            color: #666666;
            font-weight: 400;
        }

        /* 6. Responsive Adjustments for Mobile */
        @media (max-width: 480px) {
            .clock-card {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Main Card Component -->
    <div class="clock-card">
        <div id="time" class="time-display">00:00:00</div>
        <div id="date" class="date-display">Loading date...</div>
    </div>

    <script>
        /**
         * Function to update the clock and date
         * Runs every second to provide real-time updates
         */
        function updateClock() {
            const now = new Date();

            // --- Handle Time Formatting ---
            // Extract hours, minutes, and seconds
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // Add leading zeros using padStart for a consistent HH:MM:SS look
            const formattedHours = String(hours).padStart(2, '0');
            const formattedMinutes = String(minutes).padStart(2, '0');
            const formattedSeconds = String(seconds).padStart(2, '0');

            // Update the DOM
            document.getElementById('time').textContent = `${formattedHours}:${formattedMinutes}:${formattedSeconds}`;

            // --- Handle Date Formatting ---
            // Use toLocaleDateString for a professional, localized date format
            // e.g., "Monday, October 23, 2023"
            const dateOptions = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            document.getElementById('date').textContent = now.toLocaleDateString(undefined, dateOptions);
        }

        // Initialize clock immediately to avoid 1-second delay on load
        updateClock();

        // Set interval to run the update function every 1000 milliseconds (1 second)
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
