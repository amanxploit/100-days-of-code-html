<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Generator</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  background-color: #f9fafb;
  color: #111827;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.card {
  background: #ffffff;
  padding: 3rem 2rem;
  border-radius: 1rem;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  max-width: 550px;
  width: 100%;
  text-align: center;
}

#quote {
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 1.5rem;
  color: #1f2937;
}

#author {
  font-size: 1.1rem;
  color: #6b7280;
  margin-bottom: 2.5rem;
  font-style: italic;
}

button {
  background-color: #111827;
  color: #ffffff;
  border: none;
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 0.5rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:hover {
  background-color: #374151;
}

button:active {
  transform: scale(0.97);
}

@media (max-width: 480px) {
  #quote {
    font-size: 1.4rem;
  }
  .card {
    padding: 2rem 1.5rem;
  }
}
</style>
</head>
<body>

<div class="card">
  <div id="quote">"Press the button to get inspired."</div>
  <div id="author"></div>
  <button id="new-quote">New Quote</button>
</div>

<script>
(function() {
  const quotes = [
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "Innovation distinguishes between a leader and a follower.", author: "Steve Jobs" },
    { text: "Stay hungry, stay foolish.", author: "Steve Jobs" },
    { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
    { text: "In the middle of every difficulty lies opportunity.", author: "Albert Einstein" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "Hardships often prepare ordinary people for an extraordinary destiny.", author: "C.S. Lewis" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" }
  ];

  const quoteEl = document.getElementById('quote');
  const authorEl = document.getElementById('author');
  const buttonEl = document.getElementById('new-quote');

  function generateQuote() {
    const randomIndex = Math.floor(Math.random() * quotes.length);
    const selectedQuote = quotes[randomIndex];
    
    quoteEl.textContent = `"${selectedQuote.text}"`;
    authorEl.textContent = `- ${selectedQuote.author}`;
  }

  buttonEl.addEventListener('click', generateQuote);

  // Initial load
  generateQuote();
})();
</script>
</body>
</html>
