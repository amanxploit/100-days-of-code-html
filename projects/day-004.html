<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .calculator {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 340px;
        }

        #display {
            width: 100%;
            height: 80px;
            border: none;
            background: transparent;
            font-size: 2.5rem;
            text-align: right;
            margin-bottom: 20px;
            color: #1d1d1f;
            outline: none;
            padding: 0 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 64px;
            border-radius: 16px;
            border: none;
            font-size: 1.25rem;
            font-weight: 500;
            cursor: pointer;
            background-color: #f2f2f7;
            color: #1d1d1f;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #e5e5ea;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-operator {
            background-color: #e5e5ea;
            color: #007aff;
        }

        .btn-clear {
            grid-column: span 3;
            background-color: #ff3b30;
            color: white;
        }

        .btn-clear:hover {
            background-color: #d72e25;
        }

        .btn-equals {
            grid-column: span 2;
            background-color: #007aff;
            color: white;
        }

        .btn-equals:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" value="0" readonly>
    <div class="grid">
        <button class="btn-clear" onclick="clearDisplay()">C</button>
        <button class="btn-operator" onclick="append('/')">÷</button>
        
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="btn-operator" onclick="append('*')">×</button>
        
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="btn-operator" onclick="append('-')">−</button>
        
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="btn-operator" onclick="append('+')">+</button>
        
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="btn-equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    const displayElement = document.getElementById('display');

    function updateDisplay() {
        displayElement.value = currentInput;
    }

    function append(char) {
        if (currentInput === '0' && char !== '.') {
            currentInput = char;
        } else if (currentInput === 'Error') {
            currentInput = char;
        } else {
            currentInput += char;
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        updateDisplay();
    }

    function calculate() {
        try {
            // Using Function constructor as a safer alternative to eval for a basic calculator
            const result = new Function('return ' + currentInput)();
            
            // Handle division by zero or infinite results
            if (!isFinite(result)) {
                currentInput = 'Error';
            } else {
                // Limit decimals to prevent overflow
                currentInput = Number(Math.round(result + 'e10') + 'e-10').toString();
            }
        } catch (e) {
            currentInput = 'Error';
        }
        updateDisplay();
    }
</script>

</body>
</html>
