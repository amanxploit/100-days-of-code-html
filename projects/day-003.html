<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3: To-Do List</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .day { font-size: 0.9rem; color: #888; margin-bottom: 8px; }
        h1 { font-size: 1.8rem; color: #1a1a1a; margin-bottom: 12px; }
        p { color: #555; line-height: 1.6; }
        .badge {
            display: inline-block;
            margin-top: 20px;
            background: #f0f4ff;
            color: #4f46e5;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="day">Day 3 of 100</div>
        <h1>To-Do List</h1>
        <p>Simple todo list with local storage</p>
        <span class="badge">beginner</span>
    </div>
</body>
</html>
